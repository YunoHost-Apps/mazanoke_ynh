#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mazanoke"
name = "Mazanoke"
description.en = "Self-hosted local image optimizer"
description.fr = "Optimiseur d'images local auto-hébergé"

version = "1.1.6~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-3.0"
website = "https://mazanoke.com/"
demo = "https://mazanoke.com/"
code = "https://github.com/civilblur/mazanoke"


[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "70M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/emazanoke"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/civilblur/mazanoke/archive/refs/tags/v1.1.6.tar.gz"
    sha256 = "6f24bee57e5f0ed02052fe32a592a550e4b5b89a7b2c264f5fde239c7d8d97e7"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.permissions]
    main.url = "/"
